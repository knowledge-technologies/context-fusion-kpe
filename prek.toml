[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.0"
hooks = [
    # Run the formatter first (includes import sorting)
    { id = "ruff-format", types_or = ["python", "pyi"] },
    # Run the linter with fixes
    { id = "ruff", args = ["--fix"], types_or = ["python", "pyi"] },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
]
