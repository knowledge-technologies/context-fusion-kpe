[project]
name = "keyword-pecker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kristijan Armeni", email = "kristijan.armeni@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.4",
    "nltk>=3.9.2",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pip>=26.0.1",
    "polars>=1.38.1",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "regex>=2026.1.15",
    "spacy>=3.8.11",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.1.0",
    "en_core_web_sm",
]

[project.optional-dependencies]
tracking = ["wandb>=0.19"]

[tool.uv.sources]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
keyword-pecker = "keyword_pecker:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"
