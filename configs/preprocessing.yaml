# Preprocessing configuration for keyphrase extraction
#
# This file controls how raw JSON datasets are processed into
# training-ready Parquet files.
# Tokenizer config is defined in configs/models.yaml

# Sentence segmentation using spaCy
segmentation:
  spacy_model: "en_core_web_sm"
  exclude:
    - "ner"
    - "lemmatizer"
    - "attribute_ruler"
  batch_size: 100
  n_process: 32

# Keyword matching configuration
# match_mode options: "stem_equality" (recommended) or "stem_regex"
matching:
  match_mode: "stem_equality"

# Preprocessing scheme
preprocessing:
  scheme: "IOB"

# Processing options
processing:
  device: "cpu"

# Output configuration
output:
  derived_dir_name: "derived"
  compression: "snappy"
  write_metadata: true
