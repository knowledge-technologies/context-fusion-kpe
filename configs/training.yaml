training:
  epochs: 5
  outer_batch_size: 100              # sentences per gradient accumulation unit
  inner_batch_size: 50               # sentences per forward pass
  val_batch_size: 100                # batch size for validation
  base_lr: 8.0e-6                    # learning rate for base encoder parameters
  head_lr: 1.0e-5                    # learning rate for refinement head parameters
  scheme: "IOB"                      # labeling scheme: "binary" or "IOB"
  num_classes: 3                     # number of output classes (2 for binary, 3 for IOB)
  warmup_ratio: 0.1                  # fraction of training steps for warmup
  log_every: 100                     # log loss every N optimizer steps
  device: cuda                       # device to use (cpu or cuda)
  k_values: [5, 10, "N"]             # k values for @k metrics (N = doc-length)
  early_stopping_patience: 5         # 0 = disabled, N = stop after N epochs without improvement
  early_stopping_delta: 0.01         # minimum improvement to reset patience counter
  early_stopping_metric: "f1@N"      # metric to monitor
  early_stopping_mode: "max"         # "min" for loss, "max" for F1/accuracy
  early_stopping_check_every: 500    # check every 500 steps

wandb:
  enabled: false            # set to true or pass --wandb to train.py to enable
  project: "keyword-pecker" # overridden by WANDB_PROJECT env var if set
  entity: null              # overridden by WANDB_ENTITY env var if set
  tags: []
  notes: ""
