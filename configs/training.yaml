training:
  seed: 54321                        # random seed for reproducibility
  epochs: 10
  outer_batch_size: 80              # sentences per gradient accumulation unit
  inner_batch_size: 40               # sentences per forward pass
  val_batch_size: 100                # batch size for validation
  base_lr: 2e-5                    # learning rate for base encoder parameters
  head_lr: 5e-5                    # learning rate for refinement head parameters
  scheme: "IOB"                      # labeling scheme: "binary" or "IOB"
  num_classes: 3                     # number of output classes (2 for binary, 3 for IOB)
  warmup_ratio: 0.1                  # fraction of training steps for warmup
  log_every: 500                     # log loss every N optimizer steps
  device: cuda                       # device to use (cpu or cuda)
  k_values: [5, 10, "N", "M"]        # k values for @k metrics (N = num gold, M = num pred)
  early_stopping_patience: 5         # 0 = disabled, N = stop after N epochs without improvement
  early_stopping_delta: 0.005        # minimum improvement to reset patience counter
  early_stopping_metric: "f1@10"     # metric to monitor
  early_stopping_mode: "max"         # "min" for loss, "max" for F1/accuracy
  early_stopping_check_every: 500   # check every 500 steps

evaluation:
  max_keyphrases: 10                     # max keyphrases per document
  max_keyphrase_length: 5                # filter keyphrases with >= this many words
  filter_punctuation: true               # remove keyphrases containing disallowed punctuation
  # Copied from legacy TNT-KID eval code. Only dash (-) is allowed. Note: apostrophe
  # (') IS included (filtered), which differs from the TNT-KID paper that says
  # apostrophes should be kept. We keep legacy behavior for reproducible comparisons.
  disallowed_punctuation: "!#$%&'()*+,.:;<=>?@[]^_`{|}~"
  dedup_strategy: "stem"                  # "stem" (legacy) or "lowercase"
  score_method: "average"                 # "average" (legacy) or "max" probability

wandb:
  enabled: false            # set to true or pass --wandb to train.py to enable
  project: "keyword-pecker" # overridden by WANDB_PROJECT env var if set
  entity: null              # overridden by WANDB_ENTITY env var if set
  tags: []
  notes: ""
